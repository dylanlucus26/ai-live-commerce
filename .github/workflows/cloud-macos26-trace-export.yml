name: Cloud existing raw trace partial recovery (no app rerun)
on:
  push:
    branches: [feat/v0.3.0-one-click-live]
    paths:
      - .github/workflows/cloud-macos26-trace-export.yml
      - scripts/import-existing-cloud-metal-atrc.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cloud-macos26-existing-trace-export
  cancel-in-progress: false
jobs:
  import-existing-raw-trace:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Verify authorized Mac cloud before evidence processing
        run: |
          python3 - <<'PY'
          import os,platform
          assert os.environ.get("GITHUB_ACTIONS")=="true"
          assert platform.machine()=="arm64" and platform.mac_ver()[0].split(".")[0]=="26"
          print(platform.mac_ver()[0],platform.machine())
          PY
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 13019051796
          merge-multiple: true
          run-id: 41142373996
          github-token: ${{ github.token }}
          path: /tmp/ai-live-offline-metal-import/source
      - name: Read actual CLI import help and recover immutable raw trace without launching target
        run: |
          test -d "$DEVELOPER_DIR"
          python3 -m py_compile scripts/import-existing-cloud-metal-atrc.py
          python3 scripts/import-existing-cloud-metal-atrc.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos26-existing-raw-metal-offline-import
          path: /tmp/ai-live-offline-metal-import/exports/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos26-offline-generated-trace-forensic-only
          path: /tmp/ai-live-offline-metal-import/offline-recovered.trace/
          if-no-files-found: error
          retention-days: 90
