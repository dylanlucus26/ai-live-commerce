name: Real macOS OBS to local RTMP verification
on:
  push:
    branches: [feat/v0.3.0-one-click-live]
    paths:
      - .github/workflows/real-obs-macos.yml
      - scripts/run-real-obs-macos-ci.sh
      - scripts/test-real-obs-rtmp.mjs
      - scripts/validate-real-rtmp.mjs
      - scripts/test-real-obs-receiver-loss.mjs
      - scripts/test-real-obs-process-crash.mjs
      - package.json
      - scripts/test-real-obs-packaged-ui.mjs
      - scripts/test-real-obs-macos-native-source.mjs
      - electron/main/services/MacObsBrowserBootstrap.ts
      - electron/main/services/ObsService.ts
      - electron/main/services/ManagedObsSceneController.ts
      - tests/mac-obs-browser-bootstrap.test.mjs
      - electron/main/services/LiveOutputServer.ts
      - electron/main/services/VisualPreviewController.ts
      - scripts/prepare-obs-ci-profile.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-macos-obs:
    # Native Apple Silicon (ARM64), no bypass of macOS TCC permissions.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - name: Check product types and bootstrap restoration tests in cloud
        run: |
          pnpm exec tsc --noEmit
          node --import tsx --test tests/mac-obs-browser-bootstrap.test.mjs tests/obs-managed-scene.test.mjs
      - name: Install official OBS.app with Browser Source and WebSocket
        shell: bash
        run: |
          brew install --cask obs
          brew install ffmpeg
      - name: Run official macOS OBS with actual RTMP A/V capture
        shell: bash
        env:
          AI_LIVE_MAC_OBS_LAUNCH: native
          AI_LIVE_MAC_CEF_INIT: cold
        run: bash scripts/run-real-obs-macos-ci.sh
      - name: Preserve actual OBS and FFmpeg A/V evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-official-obs-local-rtmp-evidence-${{ matrix.os }}-cold
          path: |
            /tmp/ai-live-real-obs/obs.log
            /tmp/ai-live-real-obs/obs-offscreen.log
            /tmp/ai-live-real-obs/obs-native.log
            /tmp/ai-live-real-obs/obs-cef-helper.log
            /tmp/ai-live-real-obs/launchservices.log
            /tmp/ai-live-real-obs/obs-internal.log
            /tmp/ai-live-real-obs/rtmp-listener.log
            /tmp/ai-live-real-obs/rtmp-listener-ui.log
            /tmp/ai-live-real-obs/*.png
            /tmp/ai-live-real-obs/installers-SHA256SUMS.txt
            /tmp/ai-live-real-obs/recordings/*.flv
          if-no-files-found: warn
          retention-days: 90
      - name: Upload installers verified against real cold OBS and app buttons
        uses: actions/upload-artifact@v4
        with:
          name: macos-cold-verified-installers-${{ matrix.os }}
          path: |
            release/**/*.dmg
            release/**/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
