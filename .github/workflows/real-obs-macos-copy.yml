name: UNSHIPPED OBS output readback pipeline comparison
on:
  push:
    branches: [feat/v0.3.0-one-click-live]
    paths:
      - .github/workflows/real-obs-macos-copy.yml
      - scripts/patch-obs-browser-cloud-copy.py
      - scripts/install-obs-browser-cloud-copy.py
      - scripts/install-obs-cloud-reused-base.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: real-macos-obs-owned-copy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unshipped-output-readback-comparison:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      AI_LIVE_OBS_COPY_EVIDENCE: /tmp/ai-live-real-obs/copy-build
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      CODESIGN_IDENT: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: macos-numbered-motion-macos-15-launchservices-Metal
          run-id: 40813925880
          github-token: ${{ github.token }}
          path: prior-motion
      - uses: actions/download-artifact@v4
        with:
          name: unshipped-source-built-obs32-macos26-lifetime-base
          run-id: 40831785879
          github-token: ${{ github.token }}
          path: prior-unshipped-base
      - name: Check diagnostic syntax before the cloud native build
        run: |
          node --check scripts/test-real-obs-render-diagnostic.mjs
          python3 -m py_compile scripts/patch-obs-browser-cloud-copy.py scripts/install-obs-cloud-reused-base.py
      - name: Install cloud build tools
        run: |
          brew install ffmpeg cmake
      - name: Rebuild only pinned OBS browser and Metal modules on the saved cloud app
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-platform-version
          mkdir -p "$AI_LIVE_OBS_COPY_EVIDENCE"
          git clone --branch 32.2.2 --depth 1 --recurse-submodules --shallow-submodules https://github.com/obsproject/obs-studio.git cloud-obs-source
          python3 scripts/patch-obs-browser-cloud-copy.py cloud-obs-source
          cmake -S cloud-obs-source --preset macos -DCMAKE_OSX_ARCHITECTURES=arm64 -DENABLE_SCRIPTING=OFF
          cmake --build cloud-obs-source/build_macos --config Release --target obs-browser libobs-metal --parallel 3 > "$AI_LIVE_OBS_COPY_EVIDENCE/build.log" 2>&1 || { tail -n 120 "$AI_LIVE_OBS_COPY_EVIDENCE/build.log"; exit 1; }
          python3 scripts/install-obs-cloud-reused-base.py
      - name: Compare synchronous output readback, deferred readback and full ordered candidate
        env:
          AI_LIVE_MAC_OBS_LAUNCH: launchservices
          AI_LIVE_MAC_CEF_INIT: cold
          AI_LIVE_MAC_CI_MODE: render
          AI_LIVE_OBS_RENDERER: Metal
          AI_LIVE_OBS_PREVIEW_DIAGNOSTIC: 'true'
          AI_LIVE_OBS_CEF_OBSERVER: 'true'
          AI_LIVE_OBS_OWNED_COPY_ABA: 'true'
          AI_LIVE_OBS_GPU_COPY_ABA: 'true'
          AI_LIVE_OBS_QUEUE_ABA: 'true'
          AI_LIVE_OBS_UNLOCKED_COPY_ABA: 'true'
          AI_LIVE_OBS_READBACK_COMPARISON: 'true'
          AI_LIVE_OBS_SKIP_THREAD_SAMPLE: 'true'
          AI_LIVE_OBS_NUMBERED_FIXTURE_SHA256: 114839af9eea4d796830f553cb68c2bb76209a1cddba0b6dd58cd7559fa29130
        run: |
          echo "UNSHIPPED independently source-built OBS experiment; not the official bundle or alpha.4 installer"
          export AI_LIVE_OBS_NUMBERED_FIXTURE_PATH="$PWD/prior-motion/recordings/numbered-motion-input.mp4"
          node --check scripts/test-real-obs-render-diagnostic.mjs
          bash scripts/run-real-obs-macos-ci.sh
      - name: Retain the explicitly unshipped readback experiment build
        if: always()
        run: |
          if test -f "$AI_LIVE_OBS_COPY_EVIDENCE/module-provenance.json"; then
            mkdir -p /tmp/ai-live-unshipped-readback-base
            ditto -c -k --keepParent /Applications/OBS.app /tmp/ai-live-unshipped-readback-base/OBS.zip
            cp "$AI_LIVE_OBS_COPY_EVIDENCE/module-provenance.json" /tmp/ai-live-unshipped-readback-base/
            cp "$AI_LIVE_OBS_COPY_EVIDENCE/exact-obs-browser-copy-experiment.patch" /tmp/ai-live-unshipped-readback-base/
            cp cloud-obs-source/COPYING /tmp/ai-live-unshipped-readback-base/
            echo "UNSHIPPED diagnostic build. This archive is not alpha.4 or a performance acceptance pass. Read the actual workflow result." > /tmp/ai-live-unshipped-readback-base/UNACCEPTED.txt
            shasum -a 256 /tmp/ai-live-unshipped-readback-base/OBS.zip > /tmp/ai-live-unshipped-readback-base/SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UNSHIPPED-obs32-readback-test-base
          path: /tmp/ai-live-unshipped-readback-base/
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve actual cloud OBS crash reports without changing security settings
        if: always()
        run: |
          mkdir -p "$AI_LIVE_OBS_COPY_EVIDENCE/crash-reports"
          python3 - <<'PY'
          import pathlib,os,time,shutil,json
          root=pathlib.Path.home()/"Library/Logs/DiagnosticReports"
          out=pathlib.Path(os.environ["AI_LIVE_OBS_COPY_EVIDENCE"])/"crash-reports"
          paths=[p for p in root.glob("OBS*.ips") if p.stat().st_mtime>=time.time()-600]
          for p in paths:
              shutil.copy2(p,out/p.name)
          print(json.dumps({"actualCloudObsCrashReports":[str(p) for p in paths]}))
          PY
          /usr/bin/log show --last 3m --style compact --predicate '(process == "amfid" OR process == "syspolicyd" OR process == "taskgated-helper" OR process == "launchd") AND eventMessage CONTAINS[c] "OBS"' > "$AI_LIVE_OBS_COPY_EVIDENCE/actual-obs-launch-security.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos26-output-readback-comparison
          path: /tmp/ai-live-real-obs/
          if-no-files-found: error
          retention-days: 90
