name: Cloud immutable failed profiler evidence repack (no app rerun)
on:
  push:
    branches: [feat/v0.3.0-one-click-live]
    paths:
      - .github/workflows/cloud-macos26-trace-export.yml
      - scripts/extract-owned-cloud-profiler-evidence.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cloud-macos26-existing-trace-export
  cancel-in-progress: false
jobs:
  repack-existing-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 13019051796
          merge-multiple: true
          run-id: 41142373996
          github-token: ${{ github.token }}
          path: /tmp/ai-live-profiler-evidence-repack/source
      - name: Preserve all sidecars and inventory every original file without executing workload
        run: |
          python3 -m py_compile scripts/extract-owned-cloud-profiler-evidence.py
          python3 scripts/extract-owned-cloud-profiler-evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos26-owned-profiler-failed-record-metadata
          path: /tmp/ai-live-profiler-evidence-repack/metadata/
          if-no-files-found: error
          retention-days: 90
