name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.spec.js"
      - ".idea"
      - ".vscode"
      - ".dockerignore"
      - "Dockerfile"
      - ".gitignore"
      - ".github/**"
      - "!.github/workflows/build.yml"

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # macos-13 采用 intel 架构，见 https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
        os: [macos-latest, windows-latest] # os: [macos-latest, windows-latest, macos-13] 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install

      - name: Unit tests
        run: pnpm test

      - name: Build Release Files
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Chromium for renderer startup tests
        run: pnpm exec playwright install chromium

      - name: Smoke test real React page in Chromium
        run: pnpm run test:smoke

      - name: "Business flow: live comments, keyword, AI reply, voice queue (mocked external providers)"
        run: pnpm run test:business

      - name: Audit all settings layouts at three window sizes
        run: pnpm run test:layout

      - name: Verify packaged macOS signatures and DMGs
        if: matrix.os == 'macos-latest'
        shell: bash
        run: bash scripts/verify-macos-signatures.sh

      - name: Native Electron IPC and GUI smoke (macOS ARM64)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          executable="release/$(node -p "require('./package.json').version")/mac-arm64/AI Live Commerce.app/Contents/MacOS/AI Live Commerce"
          test -x "$executable"
          ELECTRON_APP_PATH="$executable" pnpm run test:electron
          ELECTRON_APP_PATH="$executable" pnpm run test:business:native

      - name: Native Electron IPC and GUI smoke (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $binary = Get-ChildItem -Path release -Recurse -Filter 'AI Live Commerce.exe' -File |
            Where-Object { $_.Directory.Name -eq 'win-unpacked' } | Select-Object -First 1
          if (-not $binary) { throw 'Packaged Windows Electron executable missing' }
          $env:ELECTRON_APP_PATH = $binary.FullName
          pnpm run test:electron
          pnpm run test:business:native

      - name: Upload startup screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-screenshots-${{ matrix.os }}
          path: |
            test-results/*.png
            test-results/layout-audit/*.jpg
            test-results/layout-audit/*.png
            test-results/business-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with: 
          name: release_on_${{ matrix.os }}
          path: |
            release/*/*.exe
            release/*/*.dmg
          retention-days: 7
