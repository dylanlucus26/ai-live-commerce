name: Voice commerce verification
on:
  push:
    branches: [feat/v0.3.0-one-click-live, feat/voice-commerce-mvp, feat/mimo-tts-live-director, feat/csv-obs-control, feat/media-voiceclone-inventory, feat/voice-commerce-complete, feat/one-screen-live-console, fix/live-workbench-react-185, fix/electron-ipc-and-polished-live-console, feat/unified-settings-no-legacy-entries, fix/resizable-settings-obs-layout, fix/settings-full-layout-audit, test/business-end-to-end]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
      - name: Launch actual Windows Electron with native IPC
        shell: pwsh
        run: |
          $binary = Get-ChildItem -Path release -Recurse -Filter 'AI Live Commerce.exe' -File |
            Where-Object { $_.Directory.Name -eq 'win-unpacked' } | Select-Object -First 1
          if (-not $binary) { throw 'No Windows unpacked app found' }
          $env:ELECTRON_APP_PATH = $binary.FullName
          pnpm run test:electron
      - name: Business services against real packaged Windows Electron (mock localhost OBS/ERP/MiMo)
        shell: pwsh
        run: |
          $binary = Get-ChildItem -Path release -Recurse -Filter 'AI Live Commerce.exe' -File |
            Where-Object { $_.Directory.Name -eq 'win-unpacked' } | Select-Object -First 1
          if (-not $binary) { throw 'Packaged Windows Electron binary missing' }
          $env:ELECTRON_APP_PATH = $binary.FullName
          pnpm run test:business:native
      - name: Install Chromium for React startup smoke test
        run: pnpm exec playwright install chromium
      - name: Verify OBS Browser Source in real Chromium (PNG and WAV)
        run: pnpm run test:browser-output
      - name: Open workbench and advanced drawer without React errors
        run: pnpm run test:smoke
      - name: Real React business flow (mock OBS, comments, AI, MiMo)
        run: pnpm run test:business
      - name: Audit all settings layouts at three window sizes
        run: pnpm run test:layout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke-screenshots-windows
          path: |
            test-results/*.png
            test-results/layout-audit/*.jpg
            test-results/layout-audit/*.png
            test-results/business-*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ai-live-commerce-windows
          path: release/**/*.exe
          if-no-files-found: warn
          retention-days: 7

  mac-ad-hoc-signature:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
        env:
          # App is ad-hoc signed by afterPack hook before DMG creation (no secrets).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify signed macOS binaries and actual DMG contents
        shell: bash
        run: bash scripts/verify-macos-signatures.sh
      - name: Launch actual signed macOS ARM64 Electron with native IPC
        shell: bash
        run: |
          executable="release/$(node -p "require('./package.json').version")/mac-arm64/AI Live Commerce.app/Contents/MacOS/AI Live Commerce"
          test -x "$executable"
          ELECTRON_APP_PATH="$executable" pnpm run test:electron
      - name: Business services against real packaged macOS Electron (mock localhost OBS/ERP/MiMo)
        shell: bash
        run: |
          executable="release/$(node -p "require('./package.json').version")/mac-arm64/AI Live Commerce.app/Contents/MacOS/AI Live Commerce"
          test -x "$executable"
          ELECTRON_APP_PATH="$executable" pnpm run test:business:native
      - name: Install Chromium for renderer smoke tests
        run: pnpm exec playwright install chromium
      - name: Verify OBS Browser Source in real Chromium (PNG and WAV)
        run: pnpm run test:browser-output
      - run: pnpm run test:smoke
      - name: Real React business flow (mock OBS, comments, AI, MiMo)
        run: pnpm run test:business
      - name: Audit all settings layouts at three window sizes
        run: pnpm run test:layout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke-screenshots-macos
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload macOS ARM64 and x64 DMG installers
        uses: actions/upload-artifact@v4
        with:
          name: ai-live-commerce-macos-dmgs
          path: release/**/*.dmg
          if-no-files-found: error
          retention-days: 7
