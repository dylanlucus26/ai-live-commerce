name: UNSHIPPED exact OBS bundle macOS15 runtime verification
on:
  push:
    branches: [feat/v0.3.0-one-click-live]
    paths: [.github/workflows/real-obs-macos-fixed-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: unshipped-fixed-runtime-macos15-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos15-verified-fixed-pipeline:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      AI_LIVE_OBS_COPY_EVIDENCE: /tmp/ai-live-real-obs/copy-build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: UNSHIPPED-obs32-readback-test-base
          run-id: 40993390878
          github-token: ${{ github.token }}
          path: current-verified-test-bundle
      - uses: actions/download-artifact@v4
        with:
          name: macos-numbered-motion-macos-15-launchservices-Metal
          run-id: 40813925880
          github-token: ${{ github.token }}
          path: prior-motion
      - name: Install the exact preceding cloud build without recompiling it
        run: |
          brew install ffmpeg
          python3 scripts/install-obs-cloud-verified-bundle.py current-verified-test-bundle
      - name: Retain the actual cloud Metal SDK contract for the remaining GPU wait investigation
        run: |
          python3 - <<'PY'
          import subprocess,pathlib,os,json
          sdk=pathlib.Path(subprocess.check_output(["xcrun","--show-sdk-path"],text=True).strip())
          found=list((sdk/"System/Library/Frameworks/Metal.framework").rglob("MTLCommandBuffer.h"))
          out=pathlib.Path(os.environ["AI_LIVE_OBS_COPY_EVIDENCE"])
          (out/"actual-metal-sdk-header-paths.json").write_text(json.dumps([str(p) for p in found]))
          for i,path in enumerate(found):
              (out/("actual-MTLCommandBuffer-"+str(i)+".h")).write_bytes(path.read_bytes())
          print(json.dumps({"actualMetalCommandBufferHeaders":[str(p) for p in found]}))
          PY
      - name: Verify the same strict candidate on macOS15 ARM64
        env:
          AI_LIVE_MAC_OBS_LAUNCH: launchservices
          AI_LIVE_MAC_CEF_INIT: cold
          AI_LIVE_MAC_CI_MODE: render
          AI_LIVE_OBS_RENDERER: Metal
          AI_LIVE_OBS_PREVIEW_DIAGNOSTIC: 'true'
          AI_LIVE_OBS_CEF_OBSERVER: 'true'
          AI_LIVE_OBS_OWNED_COPY_ABA: 'true'
          AI_LIVE_OBS_GPU_COPY_ABA: 'true'
          AI_LIVE_OBS_QUEUE_ABA: 'true'
          AI_LIVE_OBS_UNLOCKED_COPY_ABA: 'true'
          AI_LIVE_OBS_READBACK_COMPARISON: 'true'
          AI_LIVE_OBS_FINAL_CANDIDATE_ONLY: 'true'
          AI_LIVE_OBS_SKIP_THREAD_SAMPLE: 'true'
          AI_LIVE_OBS_NUMBERED_FIXTURE_SHA256: 114839af9eea4d796830f553cb68c2bb76209a1cddba0b6dd58cd7559fa29130
        run: |
          export AI_LIVE_OBS_NUMBERED_FIXTURE_PATH="$PWD/prior-motion/recordings/numbered-motion-input.mp4"
          node --check scripts/test-real-obs-render-diagnostic.mjs
          bash scripts/run-real-obs-macos-ci.sh
      - name: Preserve actual process exit, crash and system evidence
        if: always()
        run: |
          mkdir -p "$AI_LIVE_OBS_COPY_EVIDENCE/crash-reports"
          python3 - <<'PY'
          import pathlib,os,time,shutil,json
          roots=[pathlib.Path.home()/"Library/Logs/DiagnosticReports",pathlib.Path("/Library/Logs/DiagnosticReports")]
          out=pathlib.Path(os.environ["AI_LIVE_OBS_COPY_EVIDENCE"])/"crash-reports"
          found=[]
          # CrashReporter may write after launch failure; this is evidence collection, not a longer readiness gate.
          for attempt in range(2):
              for index,root in enumerate(roots):
                  for path in root.rglob("*"):
                      if path.is_file() and path.suffix in [".ips",".crash"] and path.stat().st_mtime>=time.time()-600:
                          text=path.read_text(errors="replace")
                          if "OBS" in path.name or "com.obsproject.obs-studio" in text or "/Applications/OBS.app/" in text:
                              target=out/(str(index)+"-"+path.name)
                              shutil.copy2(path,target)
                              found.append({"source":str(path),"copy":str(target)})
              if found: break
              if not attempt: time.sleep(10)
          (out/"actual-crash-report-inventory.json").write_text(json.dumps(found,indent=2))
          print(json.dumps({"actualCloudCrashReports":found}))
          PY
          /usr/bin/log show --last 5m --style json --info --debug --predicate 'process == "OBS" OR eventMessage CONTAINS[c] "com.obsproject.obs-studio" OR eventMessage CONTAINS[c] "/Applications/OBS.app/" OR (process == "kernel" AND eventMessage CONTAINS[c] "memorystatus")' > "$AI_LIVE_OBS_COPY_EVIDENCE/actual-cloud-obs-exit-system-log.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos15-final-fixed-pipeline
          path: /tmp/ai-live-real-obs/
          if-no-files-found: warn
          retention-days: 90
