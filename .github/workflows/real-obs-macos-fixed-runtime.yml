name: DIAGNOSTIC actual Mac26 ARM64 same binary via latest label
on:
  push:
    branches: [feat/v0.3.0-one-click-live]
    paths: [.github/workflows/real-obs-macos-fixed-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: unshipped-fixed-runtime-cpu-nv12-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verified-fixed-pipeline:
    name: timer-metal-${{ matrix.os }}-${{ matrix.trial }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, trial: 1}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AI_LIVE_OBS_COPY_EVIDENCE: /tmp/ai-live-real-obs/copy-build
    steps:
      - name: Verify actual cloud macOS26 ARM64 before any software setup
        env:
          CLOUD_REQUESTED_RUNNER_LABEL: ${{ matrix.os }}
        run: |
          python3 - <<'PY'
          import pathlib,platform,os,json
          assert os.environ.get("GITHUB_ACTIONS")=="true","Cloud-only run"
          data={"requestedRunnerLabel":os.environ["CLOUD_REQUESTED_RUNNER_LABEL"],
              "actualMacOS":platform.mac_ver()[0],"actualArchitecture":platform.machine()}
          out=pathlib.Path("/tmp/ai-live-real-obs");out.mkdir(parents=True,exist_ok=True)
          (out/"actual-cloud-os-preflight.json").write_text(json.dumps(data,indent=2))
          print(json.dumps(data))
          assert data["actualMacOS"].split(".")[0]=="26","Refuse any substitute OS"
          assert data["actualArchitecture"]=="arm64","Refuse any substitute architecture"
          PY
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: UNSHIPPED-obs32-readback-test-base
          run-id: 41080518879
          github-token: ${{ github.token }}
          path: current-verified-test-bundle
      - uses: actions/download-artifact@v4
        with:
          name: macos-numbered-motion-macos-15-launchservices-Metal
          run-id: 40813925880
          github-token: ${{ github.token }}
          path: prior-motion
      - name: Install the exact completed-presentation candidate without rebuilding OBS
        run: |
          brew install ffmpeg
          python3 scripts/install-obs-cloud-verified-bundle.py current-verified-test-bundle
          python3 - <<'PY'
          import pathlib,hashlib,json,platform,os,shutil
          out=pathlib.Path(os.environ["AI_LIVE_OBS_COPY_EVIDENCE"])
          p=out/"module-provenance.json";data=json.loads(p.read_text())
          expected={
            "experimentalExecutableSHA256":"e97045696a089309f58ddb37d02e9cb55c174bc98d224109e2e7e467235159da",
            "experimentalModuleSHA256":"8fb4c32ffcb2af4483e966fce30feedddfd1927e97ccb4d642dfe7947c56bfa9",
            "experimentalMetalSHA256":"3890070933edd67505d21051127b3379638e8f1999aef0628e9134cadfa1e053",
            "experimentalQtGuiSHA256":"0bf6d240591e94f43f9955c76cd2f5d0c78632532319a34e1f11b45a97b02860"}
          paths={"experimentalExecutableSHA256":"Contents/MacOS/OBS",
            "experimentalModuleSHA256":"Contents/PlugIns/obs-browser.plugin/Contents/MacOS/obs-browser",
            "experimentalMetalSHA256":"Contents/Frameworks/libobs-metal.dylib",
            "experimentalQtGuiSHA256":"Contents/Frameworks/QtGui.framework/Versions/A/QtGui"}
          for key,value in expected.items():
              assert data[key]==value,key
              assert hashlib.sha256((pathlib.Path("/Applications/OBS.app")/paths[key]).read_bytes()).hexdigest()==value,key
          data["runtimePurpose"]="Exact 344eea candidate; verify owned-input cleanup and independent Foundation versus OBS nanosleep versus user-initiated controls; retain all original gates"
          data["runtimeOS"]=platform.mac_ver()[0]
          data["runtimeTrial"]=os.environ["CLOUD_COLD_TRIAL"]
          data["runtimeBuildSourceRun"]=41080518879
          data["runtimeBuildArtifact"]=12990667778
          data["runtimeBuildArtifactZipSHA256"]="00a0d7605d2ce2e377054d95c431b92891162ec7dafadc390a72e0d590605899"
          p.write_text(json.dumps(data,indent=2))
          base=pathlib.Path("current-verified-test-bundle")
          for name in ["source-provenance.json","exact-obs-browser-copy-experiment.patch"]:
              shutil.copy2(base/name,out/name)
          print(json.dumps({"actualColdRuntimeOS":data["runtimeOS"],"trial":data["runtimeTrial"],"allFourActualComponentHashes":expected}))
          PY
        env:
          CLOUD_COLD_TRIAL: ${{ matrix.trial }}
      - name: Compile only the independent Metal diagnostic before OBS starts
        run: |
          xcrun swiftc scripts/probe-cloud-metal-after-obs.swift -o /tmp/ai-live-probe-metal-after-obs
      - name: Verify default source policy with original strict cases and added minimal control
        env:
          AI_LIVE_MAC_OBS_LAUNCH: launchservices
          AI_LIVE_MAC_CEF_INIT: cold
          AI_LIVE_MAC_CI_MODE: render
          AI_LIVE_OBS_RENDERER: Metal
          AI_LIVE_OBS_PREVIEW_DIAGNOSTIC: 'true'
          AI_LIVE_OBS_CEF_OBSERVER: 'true'
          AI_LIVE_OBS_OWNED_COPY_ABA: 'true'
          AI_LIVE_OBS_GPU_COPY_ABA: 'true'
          AI_LIVE_OBS_QUEUE_ABA: 'true'
          AI_LIVE_OBS_UNLOCKED_COPY_ABA: 'true'
          AI_LIVE_OBS_READBACK_COMPARISON: 'true'
          AI_LIVE_OBS_FINAL_CANDIDATE_ONLY: 'true'
          AI_LIVE_OBS_STALL_TRACE: 'true'
          AI_LIVE_OBS_CPU_SURFACE_COPY: 'true'
          AI_LIVE_OBS_CPU_READBACK_LAYOUT: 'true'
          AI_LIVE_OBS_PRIVATE_NV12_LAYOUT: 'true'
          AI_LIVE_OBS_NUMBERED_PIPELINE_ABA: 'true'
          AI_LIVE_OBS_MINIMAL_GPU_CONTROL: 'true'
          AI_LIVE_OBS_UPLOAD_COMPLETION_GUARD: 'true'
          AI_LIVE_OBS_IMMUTABLE_CPU_BUFFERS: 'true'
          AI_LIVE_OBS_SUBMISSION_TRACE: 'true'
          AI_LIVE_OBS_ASYNC_WINDOW_PRESENT: 'true'
          AI_LIVE_OBS_DISPLAY_GENERATION_DEDUP: 'true'
          AI_LIVE_OBS_TRACKED_DISPLAY_SYNC: 'true'
          AI_LIVE_OBS_DEFAULT_SOURCE_POLICY: 'true'
          AI_LIVE_OBS_SINGLE_PRIVATE: 'true'
          AI_LIVE_OBS_GRACEFUL_EXIT: 'true'
          AI_LIVE_OBS_SKIP_THREAD_SAMPLE: 'true'
          AI_LIVE_OBS_NUMBERED_FIXTURE_SHA256: 114839af9eea4d796830f553cb68c2bb76209a1cddba0b6dd58cd7559fa29130
        run: |
          export AI_LIVE_OBS_NUMBERED_FIXTURE_PATH="$PWD/prior-motion/recordings/numbered-motion-input.mp4"
          node --check scripts/test-real-obs-render-diagnostic.mjs
          xcrun swiftc scripts/terminate-owned-cloud-obs.swift -o /tmp/ai-live-terminate-owned-obs
          xcrun swiftc scripts/inspect-obs-foreground.swift -o /tmp/ai-live-inspect-owned-obs
          python3 -m py_compile scripts/run-cloud-minimal-metal-diagnostic.py
          python3 scripts/run-cloud-minimal-metal-diagnostic.py
      - name: Probe minimal Metal only after the exact owned OBS PID has actually exited
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,json,os,subprocess,time
          root=pathlib.Path("/tmp/ai-live-real-obs")
          report=json.loads((root/"window-b-private/render-comparison.json").read_text())
          pid=int(report["ownedObsPID"])
          snapshots=[]
          def inventory():
              text=subprocess.check_output(["ps","-axo","pid=,ppid=,command="],text=True)
              rows=[line.strip() for line in text.splitlines() if "/Applications/OBS.app/Contents/" in line]
              snapshots.append({"at":time.time(),"ownedBundleProcesses":rows})
              return rows
          remaining=inventory()
          for _ in range(12):
              if not remaining: break
              time.sleep(0.25);remaining=inventory()
          gone=False
          try: os.kill(pid,0)
          except ProcessLookupError: gone=True
          evidence={"expectedOwnedOBSPID":pid,"mainPIDGone":gone,
              "remainingOwnedObsBundleProcesses":remaining,"readOnlySnapshots":snapshots}
          (root/"actual-obs-post-exit-inventory.json").write_text(json.dumps(evidence,indent=2))
          assert gone and not remaining,"Actual owned OBS/CEF bundle processes still present; refuse independent GPU inference"
          PY
          /tmp/ai-live-probe-metal-after-obs /tmp/ai-live-real-obs/window-b-private/render-comparison.json /tmp/ai-live-real-obs/actual-obs-post-exit-inventory.json /tmp/ai-live-real-obs/raw-metal-after-obs.json
      - name: Preserve actual process exit and crash evidence
        if: always()
        run: |
          mkdir -p "$AI_LIVE_OBS_COPY_EVIDENCE/crash-reports"
          python3 - <<'PY'
          import pathlib,os,time,shutil,json
          out=pathlib.Path(os.environ["AI_LIVE_OBS_COPY_EVIDENCE"])/"crash-reports"
          found=[]
          for root in [pathlib.Path.home()/"Library/Logs/DiagnosticReports",pathlib.Path("/Library/Logs/DiagnosticReports")]:
              for p in root.glob("OBS*.ips"):
                  if p.stat().st_mtime>=time.time()-600:
                      shutil.copy2(p,out/p.name);found.append(str(p))
          (out/"actual-crash-report-inventory.json").write_text(json.dumps(found,indent=2))
          print(json.dumps({"actualCloudCrashReports":found}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timer-metal-diagnostic-${{ matrix.os }}-${{ matrix.trial }}
          path: /tmp/ai-live-real-obs/
          if-no-files-found: error
          retention-days: 90
