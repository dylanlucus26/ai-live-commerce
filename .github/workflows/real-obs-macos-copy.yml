name: UNSHIPPED identical OBS actual thread priority observations
on:
  push:
    branches: [feat/v0.3.0-one-click-live]
    paths:
      - .github/workflows/real-obs-macos-copy.yml
      - scripts/patch-obs-browser-cloud-copy.py
      - scripts/install-obs-browser-cloud-copy.py
      - scripts/install-obs-cloud-reused-base.py
      - scripts/install-obs-cloud-verified-bundle.py
      - scripts/run-cloud-cpu-layout-comparison.py
      - scripts/sample-owned-cloud-obs-priorities.c
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: real-macos-obs-owned-copy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unshipped-output-readback-comparison:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      AI_LIVE_OBS_COPY_EVIDENCE: /tmp/ai-live-real-obs/copy-build
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      CODESIGN_IDENT: '-'
    steps:
      - name: Verify actual cloud macOS26 ARM64 before any software setup
        env:
          CLOUD_REQUESTED_RUNNER_LABEL: macos-latest
        run: |
          python3 - <<'PY'
          import pathlib,platform,os,json
          assert os.environ.get("GITHUB_ACTIONS")=="true","Cloud-only run"
          data={"requestedRunnerLabel":os.environ["CLOUD_REQUESTED_RUNNER_LABEL"],
              "actualMacOS":platform.mac_ver()[0],"actualArchitecture":platform.machine()}
          out=pathlib.Path("/tmp/ai-live-real-obs");out.mkdir(parents=True,exist_ok=True)
          (out/"actual-cloud-os-preflight.json").write_text(json.dumps(data,indent=2))
          print(json.dumps(data))
          assert data["actualMacOS"].split(".")[0]=="26","Refuse any substitute OS"
          assert data["actualArchitecture"]=="arm64","Refuse any substitute architecture"
          PY
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: macos-numbered-motion-macos-15-launchservices-Metal
          run-id: 40813925880
          github-token: ${{ github.token }}
          path: prior-motion
      - uses: actions/download-artifact@v4
        with:
          name: UNSHIPPED-obs32-readback-test-base
          run-id: 41109496526
          github-token: ${{ github.token }}
          path: prior-identical-cc0-base
      - name: Check diagnostic syntax and compile only the public read-only sampler in the cloud
        run: |
          node --check scripts/test-real-obs-render-diagnostic.mjs
          python3 -m py_compile scripts/run-cloud-minimal-metal-diagnostic.py scripts/install-obs-cloud-verified-bundle.py
          xcrun clang -std=c11 -Wall -Wextra -Werror scripts/sample-owned-cloud-obs-priorities.c -lproc -o /tmp/ai-live-observe-owned-priorities
      - name: Install the exact previously verified unshipped OBS binary without rebuilding it
        run: |
          brew install ffmpeg
          python3 - <<'PY'
          import pathlib,hashlib,json
          base=pathlib.Path("prior-identical-cc0-base")
          inner=base/"OBS.zip"
          assert hashlib.sha256(inner.read_bytes()).hexdigest()=="174348df4d11adb44c32fd2243689519d828e5995d980a3e3798a432e4745873"
          data=json.loads((base/"module-provenance.json").read_text())
          expected={
              "experimentalExecutableSHA256":"2bc164c035195001efcb5a3b85be916bf4976333374eedd27a9ab6edd11e906b",
              "experimentalModuleSHA256":"b856caca091f912cdbca4a4edc5ca032c461f7a13cc85aeb3046aa3cef344f05",
              "experimentalMetalSHA256":"de3ac1c33e16e5e892176335ab699d06cf1d4d878f6f2668b15ee63c40c71dba",
              "experimentalQtGuiSHA256":"0bf6d240591e94f43f9955c76cd2f5d0c78632532319a34e1f11b45a97b02860"}
          assert all(data[key]==value for key,value in expected.items())
          print(json.dumps({"exactPriorRun":41109496526,"artifact":13004227950,"innerAppZIP":hashlib.sha256(inner.read_bytes()).hexdigest(),"expectedComponents":expected}))
          PY
          python3 scripts/install-obs-cloud-verified-bundle.py prior-identical-cc0-base
          python3 - <<'PY'
          import pathlib,json,os
          p=pathlib.Path(os.environ["AI_LIVE_OBS_COPY_EVIDENCE"])/"module-provenance.json"
          data=json.loads(p.read_text())
          data["runtimePurpose"]="Same unshipped binary on actual macOS26 ARM64, read-only public libproc kernel-priority observations"
          data["reusedPriorBuildRun"]=41109496526
          data["reusedPriorBuildArtifact"]=13004227950
          p.write_text(json.dumps(data,indent=2))
          print(json.dumps(data,indent=2))
          PY
      - name: Verify real product source settings with all diagnostic functional switches off
        env:
          AI_LIVE_MAC_OBS_LAUNCH: launchservices
          AI_LIVE_MAC_CEF_INIT: cold
          AI_LIVE_MAC_CI_MODE: render
          AI_LIVE_OBS_RENDERER: Metal
          AI_LIVE_OBS_PREVIEW_DIAGNOSTIC: 'true'
          AI_LIVE_OBS_CEF_OBSERVER: 'true'
          AI_LIVE_OBS_OWNED_COPY_ABA: 'true'
          AI_LIVE_OBS_GPU_COPY_ABA: 'true'
          AI_LIVE_OBS_QUEUE_ABA: 'true'
          AI_LIVE_OBS_UNLOCKED_COPY_ABA: 'true'
          AI_LIVE_OBS_READBACK_COMPARISON: 'true'
          AI_LIVE_OBS_FINAL_CANDIDATE_ONLY: 'true'
          AI_LIVE_OBS_STALL_TRACE: 'true'
          AI_LIVE_OBS_CPU_SURFACE_COPY: 'true'
          AI_LIVE_OBS_CPU_READBACK_LAYOUT: 'true'
          AI_LIVE_OBS_PRIVATE_NV12_LAYOUT: 'true'
          AI_LIVE_OBS_UPLOAD_COMPLETION_GUARD: 'true'
          AI_LIVE_OBS_IMMUTABLE_CPU_BUFFERS: 'true'
          AI_LIVE_OBS_NUMBERED_PIPELINE_ABA: 'true'
          AI_LIVE_OBS_MINIMAL_GPU_CONTROL: 'true'
          AI_LIVE_OBS_THREAD_QOS_TRACE: 'false'
          AI_LIVE_OBS_SUBMISSION_OBSERVER_ABA: 'true'
          AI_LIVE_OBS_EFFECTIVE_PRIORITY_TRACE: 'true'
          AI_LIVE_OBS_SUBMISSION_TRACE: 'true'
          AI_LIVE_OBS_ASYNC_WINDOW_PRESENT: 'true'
          AI_LIVE_OBS_DISPLAY_GENERATION_DEDUP: 'true'
          AI_LIVE_OBS_TRACKED_DISPLAY_SYNC: 'true'
          AI_LIVE_OBS_DEFAULT_SOURCE_POLICY: 'true'
          AI_LIVE_OBS_SINGLE_PRIVATE: 'true'
          AI_LIVE_OBS_GRACEFUL_EXIT: 'true'
          AI_LIVE_OBS_SKIP_THREAD_SAMPLE: 'true'
          AI_LIVE_OBS_NUMBERED_FIXTURE_SHA256: 114839af9eea4d796830f553cb68c2bb76209a1cddba0b6dd58cd7559fa29130
        run: |
          echo "UNSHIPPED independently source-built OBS experiment; not the official bundle or alpha.4 installer"
          export AI_LIVE_OBS_NUMBERED_FIXTURE_PATH="$PWD/prior-motion/recordings/numbered-motion-input.mp4"
          node --check scripts/test-real-obs-render-diagnostic.mjs
          xcrun swiftc scripts/terminate-owned-cloud-obs.swift -o /tmp/ai-live-terminate-owned-obs
          xcrun swiftc scripts/inspect-obs-foreground.swift -o /tmp/ai-live-inspect-owned-obs
          python3 scripts/run-cloud-minimal-metal-diagnostic.py
      - name: Preserve actual cloud OBS crash reports without changing security settings
        if: always()
        run: |
          mkdir -p "$AI_LIVE_OBS_COPY_EVIDENCE/crash-reports"
          python3 - <<'PY'
          import pathlib,os,time,shutil,json
          root=pathlib.Path.home()/"Library/Logs/DiagnosticReports"
          out=pathlib.Path(os.environ["AI_LIVE_OBS_COPY_EVIDENCE"])/"crash-reports"
          paths=[p for p in root.glob("OBS*.ips") if p.stat().st_mtime>=time.time()-600]
          for p in paths:
              shutil.copy2(p,out/p.name)
          print(json.dumps({"actualCloudObsCrashReports":[str(p) for p in paths]}))
          PY
          /usr/bin/log show --last 3m --style compact --predicate '(process == "amfid" OR process == "syspolicyd" OR process == "taskgated-helper" OR process == "launchd") AND eventMessage CONTAINS[c] "OBS"' > "$AI_LIVE_OBS_COPY_EVIDENCE/actual-obs-launch-security.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos26-identical-binary-effective-thread-priorities
          path: /tmp/ai-live-real-obs/
          if-no-files-found: error
          retention-days: 90
